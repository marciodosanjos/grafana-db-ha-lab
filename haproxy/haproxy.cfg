global
    maxconn 100

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

# =========================================================
# PORTA 5000 -> PRIMARY
# =========================================================

frontend postgres_primary
    bind *:5000
    default_backend patroni_primary

backend patroni_primary
    option httpchk GET /primary
    http-check expect status 200

    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008


# =========================================================
# PORTA 5001 -> REPLICAS
# =========================================================

frontend postgres_replicas
    bind *:5001
    default_backend patroni_replicas

backend patroni_replicas
    balance roundrobin

    option httpchk GET /replica
    http-check expect status 200

    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008


# =========================================================
# PÁGINA DE STATUS DO HAPROXY
# =========================================================

listen stats
    bind *:7000
    mode http

    stats enable
    stats uri /
    stats refresh 5s
    
